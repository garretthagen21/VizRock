<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>VizRock</title>
<!-- Add to Home Screen: launches fullscreen with no browser chrome, which matters on a
     pedalboard where a stray swipe on the address bar loses the show. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VizRock">
<meta name="theme-color" content="#0B0E13">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<!-- No webfont CDN: the venue has no internet and the fetch would block first paint.
     The font-family stacks below fall back to system faces. -->
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0; padding:0}
  :root{
    --void:#0B0E13; --panel:#141922; --panel2:#1B222E; --line:#232C3A;
    --ink:#E6EDF5; --muted:#6B7A90; --muted2:#48566B;
    --live:#35E08A; --warn:#FFB347; --idle:#3A4657; --active:#4EA8FF; --armamber:#FFCB6B;
    --home:#4EA8FF; --mono:'IBM Plex Mono',ui-monospace,monospace; --disp:'Space Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--void); color:var(--ink); font-family:var(--disp); -webkit-font-smoothing:antialiased;
    overflow:hidden; background-image:radial-gradient(circle at 50% -10%, #131a26 0%, var(--void) 60%);}
  .app{height:100vh; display:flex; flex-direction:column}
  /* The view wrappers must grow, or everything sizes to content and the page ends
     half way down. .show and .cuegrid have flex:1 but that only works if the parent
     is a flex container that actually fills the space. */
  #viewShow,#viewCues,#viewEdit{flex:1 1 auto; min-height:0; display:flex; flex-direction:column}
  header{position:relative; display:flex; align-items:center; gap:20px; padding:14px 22px; padding-top:max(14px, env(safe-area-inset-top)); border-bottom:1px solid var(--line);
    background:rgba(11,14,19,.7); backdrop-filter:blur(6px)}
  .wordmark{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.14em; font-size:13px}
  .wordmark .dot{width:9px;height:9px;border-radius:50%;background:var(--warn);box-shadow:0 0 10px var(--warn)}
  .wordmark .dot.online{background:var(--live);box-shadow:0 0 10px var(--live)}
  .wordmark small{color:var(--muted); font-weight:500; letter-spacing:.2em}
  /* Absolutely centred so it takes no room in the flex row — on a 480px-tall panel
     the header giving it its own line was costing real estate the grid needed. */
  .brand{display:flex; flex-direction:column; gap:3px; min-width:0}
  .show-id{font-family:var(--disp); font-size:16px; font-weight:700; color:var(--warn);
    letter-spacing:.04em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .spacer{flex:1}
  .toggle{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .toggle button{font-family:var(--mono); font-size:12px; letter-spacing:.12em; font-weight:600; background:transparent;
    color:var(--muted); border:0; padding:15px 20px; cursor:pointer; transition:.18s}
  .toggle button.on{background:var(--active); color:#06121f}
  .blackoutbtn{font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.12em;
    cursor:pointer; background:transparent; color:#ff8a8a; border:1px solid #3a2530;
    border-radius:8px; padding:15px 16px; transition:.15s}
  .blackoutbtn:active{background:#2a1720}
  @media (hover:hover){ .blackoutbtn:hover{background:#2a1720; border-color:#ff8a8a} }
  /* a held state has to look held */
  .blackoutbtn.on{background:#ff8a8a; color:#1a0d12; border-color:#ff8a8a;
    box-shadow:0 0 16px rgba(255,138,138,.45)}
  .clock{font-family:var(--mono); font-size:13px; color:var(--muted); letter-spacing:.06em; min-width:74px; text-align:right}

  .statusbar{display:flex; align-items:center; gap:10px; padding:14px 22px; flex-wrap:wrap}
  .pill{display:flex; align-items:center; gap:9px; padding:8px 14px 8px 12px; border:1px solid var(--line);
    border-radius:999px; background:var(--panel); font-family:var(--mono); font-size:11px; letter-spacing:.1em; font-weight:600}
  .pill .led{width:8px;height:8px;border-radius:50%;background:var(--idle);transition:.2s}
  .pill.ok .led{background:var(--live);box-shadow:0 0 8px var(--live)}
  .pill.sending .led{background:var(--active);box-shadow:0 0 8px var(--active)}
  .pill.retrying .led{background:var(--warn);box-shadow:0 0 8px var(--warn);animation:blink 1s steps(2) infinite}
  .pill.off{opacity:.5}
  .pill .st{color:var(--muted);font-weight:500}
  .pill.ok .st{color:var(--live)} .pill.retrying .st{color:var(--warn)}
  .pill.sending .st{color:var(--active)}
  /* UDP gives no delivery confirmation, so the honest signal is "a cue just left",
     not "it arrived". Flash on dispatch rather than implying a connection. */
  .pill.hit{border-color:var(--active)}
  .pill.hit .led{background:var(--active); box-shadow:0 0 14px 3px var(--active)}
  @keyframes blink{50%{opacity:.35}}
  .midiblip{margin-left:auto; display:flex; align-items:center; gap:9px; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:46%; font-family:var(--mono);
    font-size:11px; letter-spacing:.1em; color:var(--muted); font-weight:600}
  .midiblip .sq{width:11px;height:11px;border-radius:2px;border:1px solid var(--muted2);transition:.05s}
  .midiblip.hit .sq{background:var(--active);border-color:var(--active);box-shadow:0 0 12px var(--active)}

  /* SHOW: LIVE | ARMED */
  /* LIVE is what you glance at, so give it the room: wider, and its type larger than
     ON DECK. The size difference is the cue — you should know which is which without
     reading the labels. */
  .show{flex:1; display:grid; grid-template-columns:60fr 40fr; min-height:0}
  .stack{display:flex; flex-direction:column; justify-content:center; padding:8px 32px; gap:14px; min-width:0; min-height:0; height:100%}
  .stack.deck{border-left:1px solid var(--line); background:linear-gradient(180deg,#0e131b, var(--void))}
  .eyebrow{font-family:var(--mono); font-size:15px; font-weight:600; letter-spacing:.26em; color:var(--muted); display:flex; align-items:center; gap:10px}
  .eyebrow .tag{color:var(--active)}
  .deck .eyebrow .tag{color:var(--armamber)}
  .row{display:flex; align-items:center; gap:26px}
  /* the ring sits above its caption, so the column has to centre or the circle
     reads as left-aligned against wider text */
  .row > div{min-width:0}
  .row > div:last-child{display:flex; flex-direction:column; align-items:center; text-align:center}
  .num{font-family:var(--mono); font-weight:700; line-height:.82; letter-spacing:-.03em}
  .live .num{font-size:clamp(78px,12vw,150px)}
  .deck .num{font-size:clamp(58px,9vw,104px); color:var(--armamber)}
  .name{font-size:clamp(20px,2.6vw,34px); font-weight:600; margin-top:10px}
  .deck .name{color:#f0e2c4}
  .miniring{width:clamp(74px,10vw,120px); aspect-ratio:1; border-radius:50%; flex:none}
  .ringcap{font-family:var(--mono); font-size:13px; letter-spacing:.12em; color:var(--muted); margin-top:10px; text-align:center}
  .goready{font-family:var(--mono); font-size:13px; letter-spacing:.16em; color:var(--armamber); margin-top:6px}
  .goready::before{content:"▸ "; }

  .transport{display:flex; align-items:center; gap:12px; padding:14px 22px; border-top:1px solid var(--line); background:var(--panel)}
  .log{flex:1; font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .log .t{color:var(--muted2)}
  .btn{font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.1em; cursor:pointer; background:var(--panel2);
    color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:11px 15px; transition:.15s}
  .btn:active{border-color:var(--active); color:#fff; transform:translateY(1px)}
  /* :hover sticks after a tap on touch devices, which made the transport look latched */
  @media (hover:hover){ .btn:hover{border-color:var(--active); color:#fff} }
  .btn.go{background:#12271c; border-color:#2f6b48; color:var(--live); font-weight:700; padding:11px 26px}
  .btn.go:active{background:#173626; border-color:var(--live)}
  @media (hover:hover){ .btn.go:hover{background:#173626; border-color:var(--live)} }
  .btn.home{border-color:#2f4a6b; color:var(--active)}
  .btn.home:active{background:#12202f; border-color:var(--active)}
  @media (hover:hover){ .btn.home:hover{background:#12202f; border-color:var(--active)} }
  .btn.blackout{border-color:#3a2530; color:#ff8a8a}
  .btn.blackout:active{background:#2a1720; border-color:#ff8a8a}
  @media (hover:hover){ .btn.blackout:hover{background:#2a1720; border-color:#ff8a8a} }
  .foot-note{font-family:var(--mono); font-size:10px; color:var(--muted2); letter-spacing:.1em}

  /* EDIT */
  .edit{flex:1; display:grid; grid-template-columns:1.35fr 1fr; min-height:0}
  .col{min-height:0; overflow:auto; padding:18px 22px}
  .col.right{border-left:1px solid var(--line); background:var(--panel)}
  .col::-webkit-scrollbar{width:8px} .col::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .sectlab{font-family:var(--mono); font-size:11px; letter-spacing:.24em; color:var(--muted); margin:4px 0 14px}
  .sectlab.mt{margin-top:26px}
  .scene{display:flex; align-items:center; gap:14px; padding:13px 14px; border:1px solid var(--line); border-radius:10px;
    background:var(--panel); margin-bottom:9px; cursor:pointer; transition:.15s}
  @media (hover:hover){ .scene:hover{border-color:var(--muted2)} }
  .scene.sel{border-color:var(--active); background:#141d2a}
  .scene.islive{box-shadow:inset 3px 0 0 var(--live)}
  .scene.isarmed{box-shadow:inset 3px 0 0 var(--armamber)}
  .scene.ishome{border-style:dashed}
  .scene.dragging{opacity:.4}
  .scene.dropinto{border-color:var(--active); box-shadow:inset 0 2px 0 var(--active)}
  .scene .grip{font-family:var(--mono); font-size:16px; color:var(--muted2); cursor:grab;
    padding:0 4px; user-select:none}
  .scene .grip:active{cursor:grabbing}
  .flag.home{background:var(--line);color:var(--muted)}
  .scene .id{font-family:var(--mono); font-weight:700; font-size:19px; width:34px; text-align:center}
  .scene.sel .id{color:var(--active)}
  .scene .body{flex:1; min-width:0}
  .scene .nm{font-weight:600; font-size:15px; margin-bottom:6px; display:flex; align-items:center; gap:8px}
  .flag{font-family:var(--mono); font-size:9px; letter-spacing:.12em; padding:2px 6px; border-radius:4px}
  .flag.live{background:#12271c; color:var(--live)} .flag.armed{background:#2a2413; color:var(--armamber)}
  .chips{display:flex; gap:6px; flex-wrap:wrap}
  .chip{font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--muted); border:1px solid var(--line);
    border-radius:5px; padding:3px 7px; display:flex; align-items:center; gap:5px; background:var(--panel2)}
  .chip .sw{width:9px;height:9px;border-radius:50%;box-shadow:0 0 6px currentColor}
  .fire{font-family:var(--mono); font-size:15px; color:var(--muted); border:1px solid var(--line); background:var(--panel2);
    width:38px;height:38px;border-radius:9px;cursor:pointer;transition:.15s;flex:none}
  @media (hover:hover){ .fire:hover{border-color:var(--live);color:var(--live)} }
  .fire:active{border-color:var(--live);color:var(--live)}
  .insp .nm{font-size:22px;font-weight:600;margin-bottom:2px}
  .insp .sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;margin-bottom:20px}
  .field{margin-bottom:16px}
  .field label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted);display:block;margin-bottom:7px}
  .field .val{font-family:var(--mono);font-size:14px;color:var(--ink);background:var(--void);border:1px solid var(--line);border-radius:7px;padding:10px 12px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field input[type=text],.field input[type=number],.field select{width:100%;font-family:var(--mono);font-size:14px;
    color:var(--ink);background:var(--void);border:1px solid var(--line);border-radius:7px;padding:10px 12px;outline:none}
  .field input:focus,.field select:focus{border-color:var(--active)}
  .field input[type=range]{width:100%;accent-color:var(--active);background:transparent}
  .field .rowlab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:5px}
  .saved{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--live);opacity:0;transition:.2s}
  .saved.on{opacity:1}
  .slider{display:flex;align-items:center;gap:12px}
  .ringmini{width:44px;height:44px;border-radius:50%;flex:none}
  .learn{display:flex;align-items:center;justify-content:space-between;border:1px dashed var(--line);border-radius:9px;
    padding:12px 14px;margin-bottom:9px;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .learn b{color:var(--ink);font-weight:600}
  .learnbtn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--active);background:transparent;border:1px solid var(--active);border-radius:6px;padding:7px 12px;cursor:pointer}
  .out{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--panel);margin-bottom:8px;font-family:var(--mono);font-size:12px}
  .out .led{width:8px;height:8px;border-radius:50%;background:var(--idle)}
  .out.ok .led{background:var(--live);box-shadow:0 0 8px var(--live)}
  .out.sending .led{background:var(--active);box-shadow:0 0 8px var(--active)}
  .out{flex-wrap:wrap}
  .outcfg{flex-basis:100%;display:flex;gap:8px;align-items:center;margin-top:9px}
  .outcfg input{flex:1;min-width:0;font-family:var(--mono);font-size:12px;color:var(--ink);
    background:var(--void);border:1px solid var(--line);border-radius:6px;padding:8px 10px;outline:none}
  .outcfg input:focus{border-color:var(--active)}
  .outcfg input.port{flex:0 0 74px}
  .applybtn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--active);background:transparent;
    border:1px solid var(--active);border-radius:6px;padding:8px 12px;cursor:pointer;flex:none}
  .applybtn:disabled{color:var(--muted2);border-color:var(--line);cursor:default}
  .upd{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:var(--panel);
    font-family:var(--mono);font-size:12px;color:var(--muted)}
  .upd .top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .upd .net{display:flex;align-items:center;gap:7px;margin-left:auto;font-size:11px;letter-spacing:.1em}
  .upd .net .led{width:8px;height:8px;border-radius:50%;background:var(--idle)}
  .upd.online .net .led{background:var(--live);box-shadow:0 0 8px var(--live)}
  .upd.online .net{color:var(--live)}
  .upd .ver{color:var(--ink)}
  .upd .list{margin:9px 0 0;padding-left:16px;color:var(--muted)}
  .upd .list li{margin-bottom:3px}
  .upd .msg{margin-top:9px;color:var(--muted2)}
  .updbtn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;background:transparent;
    border-radius:6px;padding:8px 12px;cursor:pointer;margin-top:11px;
    color:var(--active);border:1px solid var(--active)}
  .updbtn:disabled{color:var(--muted2);border-color:var(--line);cursor:default}
  .updbtn.confirm{color:var(--warn);border-color:var(--warn)}
  .out.retrying .led{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .out .nm{color:var(--ink);font-weight:600;letter-spacing:.06em}
  .out .addr{color:var(--muted);margin-left:auto}
  /* CUES — the live control surface. Touch-sized targets, wraps to any scene count. */
  .cuehint{font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:var(--muted2);
    padding:8px 16px 0; text-transform:uppercase}
  /* The main loop is the default state, not a step in the set — pinned above the
     sequence rather than buried in it, and always reachable without scrolling. */
  /* The main loop is a different kind of thing from the setlist, so it should not
     look like a slightly different cue. Own colour, own glyph, own shape. */
  .homecue{margin:10px 16px 0; display:flex; align-items:center; gap:14px; cursor:pointer;
    background:linear-gradient(90deg, rgba(78,168,255,.16), var(--panel));
    border:1px solid rgba(78,168,255,.42); border-left:5px solid var(--home);
    border-radius:12px; padding:14px 16px; color:var(--ink); font-family:inherit;
    width:calc(100% - 32px)}
  .homecue .glyph{font-size:26px; line-height:1; color:var(--home); flex:none}
  .homecue .cn{font-family:var(--mono); font-size:22px; font-weight:700; color:var(--home)}
  .homecue .cname{font-size:17px; font-weight:700; text-align:left; letter-spacing:.01em}
  .homecue .tagline{margin-left:auto; font-family:var(--mono); font-size:11px; font-weight:700;
    letter-spacing:.18em; color:var(--home); border:1px solid rgba(78,168,255,.42);
    border-radius:6px; padding:5px 9px}
  .homecue .swatch{width:12px;height:12px;border-radius:50%;flex:none}
  .homecue.live{border-style:solid; border-color:var(--live); background:#0f2119}
  .homecue.live .cn{color:var(--live)}
  .homecue:active{border-color:var(--active)}
  @media (hover:hover){ .homecue:hover{border-color:var(--active)} }
  .cuegrid{flex:1; min-height:0; overflow:auto; display:grid; gap:10px; padding:14px 16px;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); align-content:start}
  .cue{display:flex; flex-direction:column; gap:4px; text-align:left; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:13px 14px; min-height:82px; color:var(--ink); font-family:inherit;
    transition:border-color .12s, background .12s}
  .cue .cn{font-family:var(--mono); font-size:20px; font-weight:700; letter-spacing:.02em}
  .cue .cname{font-size:14px; font-weight:600; line-height:1.25;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
  .cue .cmeta{margin-top:auto; display:flex; align-items:center; gap:7px;
    font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--muted)}
  .cue .swatch{width:10px;height:10px;border-radius:50%;flex:none}
  .cue.live{border-color:var(--live); background:#0f2119}
  .cue.live .cn{color:var(--live)}
  .cue.armed{border-color:var(--armamber)}
  .cue.armed .cn{color:var(--armamber)}
  .cue.home{border-style:dashed}
  .cue:active{border-color:var(--active)}
  @media (hover:hover){ .cue:hover{border-color:var(--active)} }
  .cueflag{font-family:var(--mono);font-size:9px;letter-spacing:.12em;padding:2px 6px;
    border-radius:4px;font-weight:700}
  .cueflag.l{background:var(--live);color:#06121f}
  .cueflag.a{background:var(--armamber);color:#06121f}
  /* Blacked out means a scene is loaded but nothing is reaching the screen. Show
     the scene so you know what you will get back, dimmed so you cannot mistake it
     for something the audience can see. */
  .blackedout .stack.live{opacity:.42}
  .blackedout .stack.live .num{color:#ff8a8a}
  .stack.live.ismain .num{color:var(--home)}
  .blackedout .live .eyebrow .tag{color:#ff8a8a}
  .blackoutmark{font-family:var(--mono); font-size:14px; letter-spacing:.16em; color:#ff8a8a;
    font-weight:700}
  .mainmark{font-family:var(--mono); font-size:14px; letter-spacing:.16em; color:var(--home);
    font-weight:700; margin-left:8px}
  .hidden{display:none!important}
  /* Narrow / portrait: the desktop shell is a fixed 100vh with overflow hidden, which
     leaves the EDIT view unreachable on a phone. Let the page scroll instead of trying
     to fit two panes into a screen that cannot hold them. */
  @media (max-width:860px){
    html,body{height:auto; overflow:auto; -webkit-text-size-adjust:100%}
    .app{height:auto; min-height:100dvh}
    header{flex-wrap:nowrap; gap:10px; padding:11px 14px; position:sticky; top:0; z-index:5;
      background:var(--void); padding-top:max(12px, env(safe-area-inset-top))}
    .show-id{font-size:15px}
    .spacer{display:none}
    .toggle{margin-left:auto}
    .clock{display:none}
    .edit{grid-template-columns:1fr; min-height:0}
    .stack{padding:16px 14px; gap:12px}
    .col{overflow:visible; padding:14px}
    .col.right{border-left:0; border-top:1px solid var(--line)}
    .statusbar{padding:10px 14px; gap:7px}
    .pill{padding:6px 10px 6px 9px; font-size:11px}
    /* transport becomes a sticky footer bar — GO must always be reachable */
    .transport{position:sticky; bottom:0; z-index:5; flex-wrap:wrap; gap:8px; padding:10px 14px;
      padding-bottom:max(10px, env(safe-area-inset-bottom))}
    .transport .btn{flex:1 1 0; min-width:0; padding:22px 8px}
    .transport .btn.go{flex:1 1 0; order:1; padding:22px 8px}
    .log{order:5; flex:1 1 100%; white-space:normal}
    .foot-note{display:none}
    .row2{grid-template-columns:1fr}
    .miniring{width:clamp(56px,18vw,90px)}
  }
  /* Portrait phone: stack LIVE over ON DECK, since there is no room side by side. */
  @media (max-width:860px) and (orientation:portrait){
    .cuegrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); grid-auto-rows:118px}
    .cue .cn{font-size:19px}
    .show{grid-template-columns:1fr}
    .stack{justify-content:flex-start}
    .stack.deck{border-left:0; border-top:1px solid var(--line)}
  }
  /* Short and wide — a 5" 800x480 panel, or a phone on its side. Keep LIVE and ON
     DECK side by side so the whole HUD is visible without scrolling, and shrink the
     chrome to buy that back. A HUD you have to scroll is not a HUD. */
  @media (max-height:560px){
    html,body{height:100%; overflow:hidden}
    .app{height:100dvh}
    header{padding:10px 12px; padding-top:max(10px, env(safe-area-inset-top)); gap:8px}
    .show-id{font-size:15px}
    .blackoutbtn{padding:16px 14px; font-size:11px}
    .toggle button{padding:16px 15px; font-size:12px}
    .statusbar{padding:5px 12px; gap:6px}
    .pill{padding:4px 9px 4px 8px; font-size:10px}
    .show{grid-template-columns:60fr 40fr}
    .stack{padding:4px 16px; gap:6px; justify-content:center}
    .stack.deck{border-left:1px solid var(--line); border-top:0}
    .eyebrow{font-size:10px; letter-spacing:.2em}
    .live .num{font-size:clamp(74px,15vw,140px); line-height:.85}
    .deck .num{font-size:clamp(46px,9vw,84px); line-height:.85}
    .live .name{font-size:clamp(21px,3.6vw,32px); margin-top:8px; line-height:1.15}
    .deck .name{font-size:clamp(17px,2.7vw,24px); margin-top:6px; line-height:1.15}
    .ringcap,.goready{margin-top:4px; font-size:10px}
    .miniring{width:clamp(52px,8.5vw,80px)}
    .row{gap:16px}
    .eyebrow{font-size:15px; letter-spacing:.2em}
    .transport{padding:7px 10px; gap:6px; flex-wrap:nowrap;
      padding-bottom:max(7px, env(safe-area-inset-bottom))}
    /* every button shares the width equally — no dead space in the bar */
    .transport .btn{flex:1 1 0; min-width:0; padding:25px 4px; font-size:14px; letter-spacing:.06em}
    .transport .btn.go{flex:1 1 0; order:0; padding:25px 4px}
    /* the event log is not worth width on a 5in panel; desktop keeps it */
    .log{display:none}
    /* EDIT has to scroll on a short screen, or the inspector is unreachable */
    #viewEdit{overflow:auto; -webkit-overflow-scrolling:touch}
    .edit{grid-template-columns:1fr; min-height:0}
    .col{overflow:visible; padding:12px 14px}
    /* Roughly 8 visible with big targets; the rest scrolls. A partly visible third
       row is deliberate — it is the only affordance saying there is more below. */
    .cuegrid{gap:10px; padding:12px; grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
      grid-auto-rows:148px}
    .cue{min-height:0; padding:12px 13px}
    .cue .cn{font-size:22px}
    .cue .cname{font-size:15px}
    .log{order:0; flex:1 1 auto; white-space:nowrap}
    .clock,.foot-note{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="wordmark"><span class="dot" id="conn"></span>VizRock <small id="mode" title="websocket to the brain, not the playing scene">connecting…</small></div>
      <div class="show-id" id="showId">—</div>
    </div>
    <div class="spacer"></div>
    <div class="toggle">
      <button id="tShow" class="on" onclick="setView('show')">SHOW</button>
      <button id="tCues" onclick="setView('cues')">CUES</button>
      <button id="tEdit" onclick="setView('edit')">EDIT</button>
    </div>
    <button class="blackoutbtn" id="blackoutBtn" onclick="act('blackout')">BLACKOUT</button>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <div class="statusbar" id="pills"></div>

  <div id="viewShow">
    <div class="show">
      <div class="stack live">
        <div class="eyebrow"><span class="tag">●</span> LIVE <span id="liveMark"></span></div>
        <div class="row">
          <div>
            <div class="num" id="lNum">--</div>
            <div class="name" id="lName">—</div>
          </div>
          <div>
            <div class="miniring" id="lRing"></div>
            <div class="ringcap" id="lCap"></div>
          </div>
        </div>
      </div>
      <div class="stack deck">
        <div class="eyebrow"><span class="tag">◇</span> ON DECK</div>
        <div class="row">
          <div>
            <div class="num" id="aNum">--</div>
            <div class="name" id="aName">—</div>
            <div class="goready">GO fires this</div>
          </div>
          <div>
            <div class="miniring" id="aRing"></div>
            <div class="ringcap" id="aCap"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="viewCues" class="hidden">
    <div class="cuehint" id="cueHint">tap arms · GO fires</div>
    <div id="homeCue"></div>
    <div class="cuegrid" id="cueGrid"></div>
  </div>

  <div id="sharedTransport">
    <div class="transport">
      <button class="btn home" onclick="act('home')">⌂ MAIN</button>
      <button class="btn" onclick="act('arm_prev')">◄ PREV</button>
      <button class="btn" onclick="act('arm_next')">NEXT ►</button>
      <button class="btn go" onclick="act('go')">GO ▸</button>
      <div class="log" id="log"><span class="t">[--:--:--]</span> connecting…</div>
    </div>
  </div>

  <div id="viewEdit" class="hidden">
    <div class="edit">
      <div class="col"><div class="sectlab">SCENE TABLE</div><div id="sceneList"></div></div>
      <div class="col right">
        <div class="sectlab">INSPECTOR</div><div class="insp" id="insp"></div>
        <div class="sectlab mt">TRIGGERS · M-VAVE CHOCOLATE</div>
        <div class="learn"><span>SW1 <b>prev</b> · SW2 <b>next</b> · SW3 <b>GO</b> · SW4 <b>blackout</b></span>
          <button class="learnbtn" onclick="learn(this)">MIDI LEARN</button></div>
        <div class="sectlab mt">OUTPUTS</div><div id="outList"></div>
        <div class="sectlab mt">CUES</div>
        <div class="upd"><div class="learn" style="margin:0;border-style:solid">
          <span>Tapping a cue <b id="tapWhat">arms it</b></span>
          <button class="learnbtn" id="tapBtn" onclick="toggleTapFires()">TOGGLE</button>
        </div></div>
        <div class="sectlab mt">CONNECT</div><div id="netBox"></div>
        <div class="sectlab mt">SOFTWARE</div><div id="updBox"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ---- demo fallback state (used only if the brain WS isn't reachable) ----
const DEMO = {
  live:3, armed:4, last_event:"demo mode · no brain connected",
  meta:{show:"THC Halloween 2026-10-30", home_scene:1},
  outputs:{resolume:"sending", dmx:"off", rings:"retrying", oled:"ok"},
  addresses:{resolume:"Garretts-M2-MacBook-Pro.local\u2192192.168.2.1", dmx:"", rings:"/dev/ring_tx (searching)", oled:"i2c 0x3c ssd1306"},
  output_config:{resolume:{type:"osc",hosts:["Garretts-M2-MacBook-Pro.local"],port:38200},
                 dmx:{type:"artnet",host:"192.168.4.60"}, rings:{type:"serial"}, oled:{type:"oled"}},
  tap_fires:false,
  blackout:false,
  network:{hostname:"vizrock-box", addresses:["10.42.1.1","10.42.0.1"]},
  update:{online:true,current:"f20083c",subject:"Show every reachable URL in the UI",
          behind:1,incoming:[{sha:"a1b2c3d",subject:"Add the CUES view"}],busy:false,
          can_update:true,message:"1 update(s) available"},
  scenes:[
    {id:1,name:"Main loop",resolume:{layer:1,clip:1},dmx:{cue:"off"},ring:{mode:"pulse",hue:200,bright:80,speed:2},audio:false},
    {id:2,name:"Opening \u2014 fog",resolume:{layer:1,clip:2},dmx:{cue:"off"},ring:{mode:"solid",hue:180,bright:90,speed:0},audio:false},
    {id:3,name:"Graveyard",resolume:{layer:1,clip:3},dmx:{cue:"off"},ring:{mode:"chase",hue:100,bright:110,speed:3},audio:false},
    {id:4,name:"Jump scare",resolume:{layer:1,clip:4},dmx:{cue:"off"},ring:{mode:"strobe",hue:0,bright:255,speed:9},audio:false},
    {id:5,name:"Song B \u2014 drop",resolume:{layer:1,clip:5},dmx:{cue:"off"},ring:{mode:"strobe",hue:150,bright:200,speed:8},audio:false},
    {id:6,name:"Blood moon",resolume:{layer:1,clip:6},dmx:{cue:"off"},ring:{mode:"pulse",hue:0,bright:160,speed:2},audio:false},
    {id:7,name:"Interlude",resolume:{layer:1,clip:7},dmx:{cue:"off"},ring:{mode:"chase",hue:280,bright:100,speed:4},audio:true},
    {id:8,name:"Finale",resolume:{layer:1,clip:8},dmx:{cue:"off"},ring:{mode:"strobe",hue:40,bright:220,speed:7},audio:false}
  ]
};
let state = structuredClone(DEMO);
let selected = 1, ws = null, online = false;

const H = h => Math.round(h/255*360);
const now = () => new Date().toTimeString().slice(0,8);
const scene = id => state.scenes.find(s=>s.id===id);
const order = () => state.scenes.filter(s=>s.id!==(state.meta?.home_scene??0)).map(s=>s.id);

// ---- websocket to the brain (graceful demo fallback) ----
function connect(){
  try{ ws = new WebSocket(`ws://${location.host}/ws`); }catch(e){ return; }
  ws.onopen = ()=>{ online=true; document.getElementById('conn').classList.add('online');
    // not "live" — LIVE means the playing scene everywhere else in this UI
    document.getElementById('mode').textContent="connected"; };
  ws.onmessage = e => { const d=JSON.parse(e.data); if(d.type==="state"){ state=d; blip(); render(); } };
  ws.onclose = ()=>{ online=false; document.getElementById('conn').classList.remove('online');
    document.getElementById('mode').textContent="no brain"; setTimeout(connect, 2000); };
  ws.onerror = ()=>{ try{ws.close();}catch(_){} };
}
function act(action, sceneId){
  if(online && ws && ws.readyState===1){ ws.send(JSON.stringify({type:"action",action,scene:sceneId})); return; }
  demoAct(action, sceneId);                          // local simulation
}
function demoAct(action, sceneId){
  const ord=order();
  if(action==="arm_prev"){ let i=ord.indexOf(state.armed); state.armed=ord[Math.max(0,i-1)]; state.last_event=`armed → ${lbl(state.armed)}`; }
  else if(action==="arm_next"){ let i=ord.indexOf(state.armed); state.armed=ord[Math.min(ord.length-1,i+1)]; state.last_event=`armed → ${lbl(state.armed)}`; }
  else if(action==="go"){ state.live=state.armed; let i=ord.indexOf(state.live); state.armed=ord[Math.min(ord.length-1,i+1)]; state.last_event=`LIVE → ${lbl(state.live)} · dispatched`; }
  else if(action==="goto"){ state.live=sceneId; state.last_event=`LIVE → ${lbl(sceneId)}`; }
  else if(action==="home"){ const h=state.meta?.home_scene??0; state.live=h; state.last_event=`LIVE → ${lbl(h)}`; }
  else if(action==="blackout"){ state.live=0; state.last_event=`LIVE → 00 Blackout`; }
  blip(); render();
}
const lbl = id => { const s=scene(id); return s?`${String(id).padStart(2,'0')} ${s.name}`:String(id); };

// ---- ring visualization ----
function paintRing(el, r){
  if(!el) return;
  const hue=H(r.hue), light=38+r.bright/255*24, sat=r.mode==="off"?0:85, col=`hsl(${hue} ${sat}% ${light}%)`;
  el.style.animation="none";
  if(r.mode==="off"){ el.style.background="conic-gradient(#161b24,#161b24)"; el.style.boxShadow="none"; el.style.opacity=".5"; return; }
  el.style.opacity="1";
  el.style.background = r.mode==="chase"
    ? `conic-gradient(${col}, transparent 40%, ${col})`
    : `radial-gradient(closest-side,#0c1017 55%,${col} 58%,${col} 80%,transparent 84%)`;
  const glow=12+r.bright/255*26; el.style.boxShadow=`0 0 ${glow}px ${Math.round(glow/2)}px ${col}`;
  const dur=Math.max(0.25,2.4-r.speed*0.26)+"s";
  if(r.mode==="pulse")  el.style.animation=`rpulse ${dur} ease-in-out infinite`;
  if(r.mode==="strobe") el.style.animation=`rstrobe ${Math.max(0.12,0.5-r.speed*0.04)}s steps(2) infinite`;
  if(r.mode==="chase")  el.style.animation=`rspin ${dur} linear infinite`;
}
const kf=document.createElement('style');
kf.textContent=`@keyframes rpulse{0%,100%{filter:brightness(.6)}50%{filter:brightness(1.35)}}@keyframes rstrobe{50%{opacity:.15}}@keyframes rspin{to{transform:rotate(360deg)}}`;
document.head.appendChild(kf);
const capOf = r => r.mode==="off" ? "OFF" : `${r.mode.toUpperCase()} · H${r.hue} · ${r.bright}`;

// ---- render ----
let lastLive;
function flashOutputs(){
  document.querySelectorAll('#pills .pill').forEach(el=>{
    el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'), 260);
  });
}
function render(){
  if(lastLive !== undefined && state.live !== lastLive) flashOutputs();
  lastLive = state.live;
  document.querySelector('.app').classList.toggle('blackedout', !!state.blackout);
  document.querySelector('.stack.live')?.classList
    .toggle('ismain', state.live === (state.meta?.home_scene ?? 1));
  const lm=document.getElementById('liveMark');
  const isMain = state.live !== null && state.live === (state.meta?.home_scene ?? 1);
  if(lm) lm.innerHTML = (state.blackout ? '<span class="blackoutmark">· BLACKED OUT</span>' : '')
                      + (isMain ? '<span class="mainmark">· ⌂ MAIN LOOP</span>' : '');
  const bb=document.getElementById('blackoutBtn');
  if(bb){ bb.classList.toggle('on', !!state.blackout);
          bb.textContent = state.blackout ? "BLACKOUT ON" : "BLACKOUT"; }
  document.getElementById('showId').textContent = state.meta?.show || "—";
  renderPills();
  if(!document.getElementById('viewShow').classList.contains('hidden')) renderShow();
  if(!document.getElementById('viewCues').classList.contains('hidden')) renderCues();
  if(!document.getElementById('viewEdit').classList.contains('hidden')){
    renderList();
    renderTapMode();
    renderNetwork();
    renderUpdate();
    // a server echo must not yank the input out from under the operator
    if(!document.getElementById('insp')?.contains(document.activeElement)) renderInsp();
  }
  const l=document.getElementById('log'); l.innerHTML=`<span class="t">[${now()}]</span> ${state.last_event||""}`;
}
const outputKeys = () => Object.keys(state.outputs||{});
function renderPills(){
  const labels={resolume:"VISUALS",dmx:"DMX",rings:"RINGS",oled:"DISPLAY"};
  const wrap=document.getElementById('pills'); wrap.innerHTML="";
  outputKeys().forEach(k=>{
    const st=state.outputs?.[k]||"off";
    const el=document.createElement('div'); el.className="pill "+st;
    el.innerHTML=`<span class="led"></span>${labels[k]||k.toUpperCase()} <span class="st">${st}</span>`;
    wrap.appendChild(el);
  });
  const b=document.createElement('div'); b.className="midiblip"; b.id="blip";
  b.title="flashes when the brain pushes new state";
  b.innerHTML=`<span class="sq"></span>${esc(state.last_event||"")}`;
  wrap.appendChild(b);
}
function renderShow(){
  const L=scene(state.live)||{name:"—",ring:{mode:"off",hue:0,bright:0}};
  const A=scene(state.armed)||{name:"—",ring:{mode:"off",hue:0,bright:0}};
  document.getElementById('lNum').textContent=String(state.live??0).padStart(2,'0');
  document.getElementById('lName').textContent=L.name;
  paintRing(document.getElementById('lRing'),L.ring); document.getElementById('lCap').textContent=capOf(L.ring);
  document.getElementById('aNum').textContent=String(state.armed??0).padStart(2,'0');
  document.getElementById('aName').textContent=A.name;
  paintRing(document.getElementById('aRing'),A.ring); document.getElementById('aCap').textContent=capOf(A.ring);
}
function ringColor(r){ return r.mode==="off"?"#3a4657":`hsl(${H(r.hue)} 85% ${45+r.bright/255*20}%)`; }
let dragId = null;
function renderList(){
  const wrap=document.getElementById('sceneList'); wrap.innerHTML="";
  const home=state.meta?.home_scene??1;
  // Reordering is desktop-only: dragging with a finger fights scrolling, and a
  // pedalboard is not where you rearrange a setlist.
  const canDrag = matchMedia('(hover:hover) and (pointer:fine)').matches;
  state.scenes.forEach(s=>{
    const el=document.createElement('div');
    const isHome = s.id===home;
    el.className="scene"+(s.id===selected?" sel":"")+(s.id===state.live?" islive":"")
                +(s.id===state.armed?" isarmed":"")+(isHome?" ishome":"");
    el.onclick=()=>{ selected=s.id; renderList(); renderInsp(); };
    if(canDrag && !isHome){
      el.draggable=true;
      el.ondragstart=e=>{ dragId=s.id; el.classList.add('dragging');
                          e.dataTransfer.effectAllowed='move'; };
      el.ondragend=()=>{ dragId=null; renderList(); };
      el.ondragover=e=>{ if(dragId!==null && dragId!==s.id){ e.preventDefault(); el.classList.add('dropinto'); } };
      el.ondragleave=()=>el.classList.remove('dropinto');
      el.ondrop=e=>{ e.preventDefault(); el.classList.remove('dropinto'); dropOn(s.id); };
    }
    const flags=(s.id===state.live?`<span class="flag live">LIVE</span>`:"")
               +(s.id===state.armed?`<span class="flag armed">ARMED</span>`:"")
               +(isHome?`<span class="flag home">MAIN</span>`:"");
    el.innerHTML=`<div class="id">${String(s.id).padStart(2,'0')}</div>
      <div class="body"><div class="nm">${esc(s.name)} ${flags}</div>
      <div class="chips">
        <span class="chip">▚ ${s.resolume?.clear?"clear":("L"+s.resolume.layer+"·C"+s.resolume.clip)}</span>
        <span class="chip">✦ ${s.dmx?.cue||"—"}</span>
        <span class="chip" style="color:${ringColor(s.ring)}"><span class="sw" style="background:${ringColor(s.ring)}"></span>${s.ring.mode}</span>
        <span class="chip">${s.audio?"♪ audio":"muted"}</span></div></div>
      ${canDrag && !isHome?`<span class="grip" title="drag to reorder">⠿</span>`:""}
      <button class="fire" title="test-fire" onclick="event.stopPropagation(); testFire(${s.id})">▸</button>`;
    wrap.appendChild(el);
  });
}
// Ids are set positions, so a reorder renumbers. Each scene keeps its own clip, so
// the video travels with it.
function dropOn(targetId){
  const home=state.meta?.home_scene??1;
  if(dragId===null || dragId===targetId) return;
  const order=state.scenes.filter(s=>s.id!==home).map(s=>s.id);
  const from=order.indexOf(dragId), to=order.indexOf(targetId);
  if(from<0 || to<0) return;
  order.splice(to, 0, order.splice(from, 1)[0]);
  if(online && ws && ws.readyState===1) ws.send(JSON.stringify({type:"reorder", order}));
  dragId=null;
}
const RING_MODES = ["off","solid","pulse","chase","strobe"];
function renderInsp(){
  const s=scene(selected); if(!s){document.getElementById('insp').innerHTML="";return;}
  const r=s.ring||{mode:"off"};
  const opts=RING_MODES.map(m=>`<option value="${m}"${r.mode===m?" selected":""}>${m}</option>`).join("");
  document.getElementById('insp').innerHTML=`
    <div class="nm">${s.name}</div>
    <div class="sub">SCENE ${String(s.id).padStart(2,'0')} <span class="saved" id="savedTag">SAVED</span></div>
    <div class="field"><label>NAME</label>
      <input type="text" id="f_name" value="${s.name.replace(/"/g,'&quot;')}"></div>
    <div class="field"><label>VISUALS — RESOLUME</label>${s.resolume?.clear
      ? `<div class="val">clear all</div>`
      : `<div class="row2"><div><div class="rowlab"><span>layer</span></div>
           <input type="number" id="f_layer" min="1" value="${s.resolume?.layer??1}"></div>
         <div><div class="rowlab"><span>clip</span></div>
           <input type="number" id="f_clip" min="1" value="${s.resolume?.clip??1}"></div></div>`}</div>
    <div class="field"><label>DMX CUE</label>
      <input type="text" id="f_cue" value="${(s.dmx?.cue||"").replace(/"/g,'&quot;')}"></div>
    <div class="field"><label>RING</label>
      <div class="slider"><div class="ringmini" id="mini"></div>
        <div style="flex:1"><select id="f_mode">${opts}</select></div></div>
      <div style="margin-top:12px">
        <div class="rowlab"><span>hue</span><span id="l_hue">${r.hue??0}</span></div>
        <input type="range" id="f_hue" min="0" max="255" value="${r.hue??0}">
        <div class="rowlab"><span>bright</span><span id="l_bright">${r.bright??0}</span></div>
        <input type="range" id="f_bright" min="0" max="255" value="${r.bright??0}">
        <div class="rowlab"><span>speed</span><span id="l_speed">${r.speed??0}</span></div>
        <input type="range" id="f_speed" min="0" max="10" value="${r.speed??0}">
      </div></div>`;
  paintRing(document.getElementById('mini'),r);
  ["f_name","f_layer","f_clip","f_cue","f_mode","f_hue","f_bright","f_speed"].forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    el.addEventListener('input',()=>{
      ["hue","bright","speed"].forEach(k=>{
        const v=document.getElementById('f_'+k), lab=document.getElementById('l_'+k);
        if(v&&lab) lab.textContent=v.value;
      });
      paintRing(document.getElementById('mini'), readRing());
      queueSceneEdit();
    });
  });
}
function readRing(){
  const num=id=>{const e=document.getElementById(id); return e?parseInt(e.value,10)||0:0;};
  const mode=document.getElementById('f_mode')?.value||"off";
  return {mode, hue:num('f_hue'), bright:num('f_bright'), speed:num('f_speed')};
}
// Debounced: sliders fire per pixel and every edit writes scenes.json to the SD card.
let editTimer=null;
function queueSceneEdit(){ clearTimeout(editTimer); editTimer=setTimeout(sendSceneEdit,300); }
function sendSceneEdit(){
  const s=scene(selected); if(!s) return;
  const el=id=>document.getElementById(id);
  const edited={...s, name:el('f_name')?.value ?? s.name, ring:readRing(),
                dmx:{...(s.dmx||{}), cue:el('f_cue')?.value ?? ""}};
  if(!s.resolume?.clear && el('f_layer') && el('f_clip')){
    edited.resolume={...(s.resolume||{}), layer:parseInt(el('f_layer').value,10)||1,
                                          clip:parseInt(el('f_clip').value,10)||1};
  }
  if(online && ws && ws.readyState===1){ ws.send(JSON.stringify({type:"edit_scene",scene:edited})); }
  else { state.scenes=state.scenes.map(x=>x.id===edited.id?edited:x); renderList(); }
  const tag=document.getElementById('savedTag');
  if(tag){ tag.classList.add('on'); setTimeout(()=>tag.classList.remove('on'),900); }
}
function renderTapMode(){
  const what=document.getElementById('tapWhat'); if(!what) return;
  what.textContent = state.tap_fires ? "fires it immediately" : "arms it";
  const btn=document.getElementById('tapBtn');
  if(btn) btn.textContent = state.tap_fires ? "MAKE IT ARM" : "MAKE IT FIRE";
}
function toggleTapFires(){
  if(online && ws && ws.readyState===1)
    ws.send(JSON.stringify({type:"set_tap_fires", value:!state.tap_fires}));
}
function renderNetwork(){
  const box=document.getElementById('netBox'); if(!box) return;
  const n=state.network;
  if(!n){ box.innerHTML=`<div class="upd"><div class="msg">unavailable</div></div>`; return; }
  const urls=[`${n.hostname}.local`, ...(n.addresses||[])]
    .map(h=>`<li><span class="ver">http://${esc(h)}:8080</span></li>`).join("");
  box.innerHTML=`<div class="upd">
      <div class="msg">Open any of these from a phone or laptop on the same network</div>
      <ul class="list">${urls}</ul></div>`;
}
let confirmingUpdate = false;
function renderUpdate(){
  const box=document.getElementById('updBox'); if(!box) return;
  const u=state.update;
  if(!u){ box.innerHTML=`<div class="upd"><div class="msg">unavailable</div></div>`; return; }
  const net=u.online?"ONLINE":"OFFLINE";
  const list=u.incoming?.length
    ? `<ul class="list">${u.incoming.map(c=>`<li>${c.sha} ${esc(c.subject)}</li>`).join("")}</ul>` : "";
  const label = u.busy ? "WORKING…" : confirmingUpdate ? "CONFIRM — RESTARTS NOW" : "UPDATE & RESTART";
  box.innerHTML=`<div class="upd ${u.online?"online":""}">
      <div class="top"><span class="ver">${u.current||"—"}</span>
        <span class="net"><span class="led"></span>${net}</span></div>
      <div>${esc(u.subject||"")}</div>
      ${list}
      <div class="msg">${esc(u.message||"")}</div>
      <button class="updbtn ${confirmingUpdate?"confirm":""}" id="updBtn"
        ${u.can_update?"":"disabled"} onclick="askUpdate()">${label}</button>
    </div>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// two-step: the first click only arms the button, so a stray tap can't restart the show
function askUpdate(){
  const u=state.update; if(!u?.can_update) return;
  if(!confirmingUpdate){
    confirmingUpdate=true; renderUpdate();
    setTimeout(()=>{ if(confirmingUpdate){ confirmingUpdate=false; renderUpdate(); } }, 5000);
    return;
  }
  confirmingUpdate=false;
  if(online && ws && ws.readyState===1) ws.send(JSON.stringify({type:"update", to:u.incoming[0].sha}));
  renderUpdate();
}
function renderCues(){
  const grid=document.getElementById('cueGrid'); if(!grid) return;
  const home=state.meta?.home_scene??1;
  const hint=document.getElementById('cueHint');
  if(hint) hint.textContent = state.tap_fires ? "tap fires immediately" : "tap arms · GO fires";
  grid.innerHTML="";
  // the main loop is pinned above and excluded from the sequence grid
  const homeBox=document.getElementById('homeCue');
  if(homeBox){
    const h=(state.scenes||[]).find(s=>s.id===home);
    homeBox.innerHTML="";
    if(h){
      const ring=h.ring||{mode:"off"};
      const el=document.createElement('button');
      el.className="homecue"+(h.id===state.live?" live":"");
      el.onclick=()=>act('home');
      el.innerHTML=`<span class="glyph">⌂</span>
        <span class="cn">${String(h.id).padStart(2,'0')}</span>
        <span class="swatch" style="background:${ringColor(ring)}"></span>
        <span class="cname">${esc(h.name)}</span>
        <span class="tagline">${h.id===state.live?"LIVE · ":""}MAIN LOOP</span>`;
      homeBox.appendChild(el);
    }
  }
  (state.scenes||[]).filter(s=>s.id!==home).forEach(s=>{
    const el=document.createElement('button');
    const isLive=s.id===state.live, isArmed=s.id===state.armed;
    el.className="cue"+(isLive?" live":"")+(isArmed?" armed":"");
    // arming is the safe default; firing straight from a tap is opt-in, because a
    // mis-tap that only changes what is queued costs nothing
    el.onclick=()=>act(state.tap_fires ? 'goto' : 'arm', s.id);
    const ring=s.ring||{mode:"off"};
    const flag = isLive?'<span class="cueflag l">LIVE</span>'
               : isArmed?'<span class="cueflag a">ARMED</span>' : '';
    el.innerHTML=`<div class="cn">${String(s.id).padStart(2,'0')} ${flag}</div>
      <div class="cname">${esc(s.name)}</div>
      <div class="cmeta"><span class="swatch" style="background:${ringColor(ring)}"></span>
        ${esc(capOf(ring))}</div>`;
    grid.appendChild(el);
  });
}
function renderOuts(){
  const wrap=document.getElementById('outList'); if(!wrap) return;
  if(wrap.contains(document.activeElement)) return;   // don't clobber a field mid-edit
  wrap.innerHTML="";
  outputKeys().forEach(k=>{
    const st=state.outputs?.[k]||"off";
    const cfg=state.output_config?.[k]||{};
    const el=document.createElement('div'); el.className="out "+st;
    const addr=state.addresses?.[k]||"—";
    let fields="";
    if("hosts" in cfg) fields+=`<input type="text" id="c_${k}_hosts" value="${(cfg.hosts||[]).join(', ')}" placeholder="name.local, 10.0.0.5">`;
    else if("host" in cfg) fields+=`<input type="text" id="c_${k}_host" value="${cfg.host||""}" placeholder="host or ip">`;
    if("port" in cfg) fields+=`<input type="number" class="port" id="c_${k}_port" value="${cfg.port}" min="1" max="65535">`;
    el.innerHTML=`<span class="led"></span><span class="nm">${k.toUpperCase()}</span><span class="addr">${addr}</span>`
      + (fields?`<div class="outcfg">${fields}<button class="applybtn" onclick="applyOutput('${k}',this)">APPLY</button></div>`:"");
    wrap.appendChild(el);
  });
}
function applyOutput(name,btn){
  const val=id=>document.getElementById(id)?.value;
  const spec={};
  const hosts=val(`c_${name}_hosts`);
  if(hosts!==undefined) spec.hosts=hosts.split(',').map(s=>s.trim()).filter(Boolean);
  const host=val(`c_${name}_host`);
  if(host!==undefined) spec.host=host.trim();
  const port=val(`c_${name}_port`);
  if(port!==undefined) spec.port=parseInt(port,10);
  if(!(online && ws && ws.readyState===1)){ flashApply(btn,"OFFLINE"); return; }
  ws.send(JSON.stringify({type:"edit_config",name,spec}));
  flashApply(btn,"APPLIED");
}
// The brain rejects a spec that will not come up and rolls back, so the next
// state push is the real answer — this is just acknowledgement of the click.
function flashApply(btn,text){
  if(!btn) return;
  const was=btn.textContent; btn.textContent=text; btn.disabled=true;
  setTimeout(()=>{btn.textContent=was; btn.disabled=false;},1200);
}
function testFire(id){ setView('show'); act("goto", id); }
function learn(b){ b.textContent="LISTENING…"; b.style.color="var(--warn)"; b.style.borderColor="var(--warn)";
  setTimeout(()=>{ b.textContent="CAPTURED"; b.style.color="var(--live)"; b.style.borderColor="var(--live)"; },1400); }
function blip(){ const b=document.getElementById('blip'); if(!b)return; b.classList.add('hit'); setTimeout(()=>b.classList.remove('hit'),120); }
function setView(v){
  ['show','cues','edit'].forEach(name=>{
    document.getElementById('view'+name[0].toUpperCase()+name.slice(1)).classList.toggle('hidden', name!==v);
    document.getElementById('t'+name[0].toUpperCase()+name.slice(1)).classList.toggle('on', name===v);
  });
  // the transport is a live control; EDIT is config and does not need it
  document.getElementById('sharedTransport').classList.toggle('hidden', v==='edit');
  if(v==='show') renderShow();
  else if(v==='cues') renderCues();
  else { renderList(); renderInsp(); renderOuts(); renderTapMode(); renderNetwork(); renderUpdate(); }
}
setInterval(()=>document.getElementById('clock').textContent=now(),1000);
document.getElementById('clock').textContent=now();
render(); connect();
window.act=act; window.setView=setView; window.testFire=testFire; window.learn=learn;
window.dropOn=dropOn; window.applyOutput=applyOutput; window.renderCues=renderCues; window.toggleTapFires=toggleTapFires; window.askUpdate=askUpdate;
</script>
</body>
</html>
